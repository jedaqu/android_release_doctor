name: "Android Release Doctor"
author: "JEDAQU"
description: "Audit Android APK and AAB artifacts in GitHub Actions with evidence-based checks."

inputs:
  artifact:
    description: "Path to the APK or AAB to audit."
    required: true
  project:
    description: "Optional Android application module path."
    required: false
    default: ""
  play:
    description: "Apply the Google Play readiness profile."
    required: false
    default: "false"
  play-platform:
    description: "Google Play platform passed to the CLI when play=true."
    required: false
    default: "mobile"
  format:
    description: "Report format: text or json."
    required: false
    default: "text"
  output:
    description: "Optional report output path."
    required: false
    default: ""
  engine-version:
    description: "Optional prebuilt Android Release Doctor engine version. Defaults to the runtime manifest."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exact Android Release Doctor process exit code."
  report-path:
    description: "The supplied report output path, or empty when stdout is used or runtime setup failed."

branding:
  icon: "shield"
  color: "blue"

runs:
  using: "node24"
  main: "dist/index.js"
