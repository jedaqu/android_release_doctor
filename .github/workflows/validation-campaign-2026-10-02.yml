
name: Second Product Validation Campaign

on:
  push:
    branches:
      - test/validation-campaign-2026-10-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-crypto:
    name: "Baseline, crypto and Play"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build CLI
        run: cargo build --quiet -p doctor-cli
      - name: Crypto semantic oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output/crypto
          run_case() {
            local id="$1" artifact="$2" rule="$3" expected="$4"
            local report="validation-output/crypto/$id.json"
            set +e
            ./target/debug/android-release-doctor --format json --output "$report" "$artifact"
            local code=$?
            set -e
            test "$code" = "0" || test "$code" = "1" || test "$code" = "2"
            python3 - "$report" "$id" "$rule" "$expected" <<'PY'
          import json,sys
          path,case_id,rule,expected=sys.argv[1:5]
          r=json.load(open(path,encoding="utf-8"))
          f=next((x for x in r["findings"] if x["rule_id"]==rule),None)
          assert f is not None, f"{case_id}: missing {rule}"
          assert f["severity"]==expected, f"{case_id}: expected {expected}, got {f['severity']}"
          print(case_id, rule, f["severity"])
          PY
          }
          run_case v2 tests/fixtures/crypto-v2-release.apk SIGNING-003 PASS
          run_case v3 tests/fixtures/crypto-v3-release.apk SIGNING-003 PASS
          run_case v31 tests/fixtures/crypto-v31-release.apk SIGNING-003 PASS
          run_case v31-lineage-mismatch tests/fixtures/crypto-v31-lineage-mismatch.apk SIGNING-003 BLOCKER
          run_case v31-rotation-min-sdk tests/fixtures/crypto-v31-wrong-rotation-min-sdk.apk SIGNING-003 BLOCKER
          run_case ecdsa-v2 tests/fixtures/m07-crypto-v2-ecdsa-sha512-p384.apk SIGNING-003 PASS
          run_case ecdsa-v3 tests/fixtures/m07-crypto-v3-ecdsa-sha512-p384.apk SIGNING-003 PASS
      - name: Play profile boundary oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output/play
          for platform in mobile wear automotive tv xr; do
            report="validation-output/play/$platform.json"
            set +e
            ./target/debug/android-release-doctor --play --play-platform "$platform" --format json --output "$report" tests/fixtures/minimal-release.apk
            code=$?
            set -e
            test "$code" = "0" || test "$code" = "1"
            python3 - "$report" "$platform" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          platform=sys.argv[2]
          assert r["play"]["platform"]==platform
          assert r["play"]["policy_version"]=="2026-08-31"
          assert any(x["rule_id"]=="PLAY-000" for x in r["findings"])
          print(platform,"ok")
          PY
          done
      - name: Action smoke test
        continue-on-error: true
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: tests/fixtures/crypto-v2-release.apk
          play: "true"
          play-platform: mobile
          format: json
          output: validation-output/action-smoke.json
      - name: Validate smoke reports
        run: |
          set -euo pipefail
          # The action-spaces invocation is intentionally after the copy in the actual product test below.
          true
          test -s validation-output/crypto/v2.json
          test -s validation-output/play/mobile.json

  controlled-native-aab:
    name: "Native ABI and AAB boundary"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build CLI
        run: cargo build --quiet -p doctor-cli
      - name: Create controlled artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
            from pathlib import Path
            from zipfile import ZipFile,ZIP_DEFLATED,ZIP_STORED
            base_apk=Path("tests/fixtures/minimal-release.apk")
            base_aab=Path("tests/fixtures/minimal-release.aab")
            out=Path("validation-output")
            out.mkdir(parents=True,exist_ok=True)
            
            def elf64(a):
                b=bytearray(120); b[0:4]=b"\x7fELF"; b[4]=2; b[5]=1
                b[32:40]=(64).to_bytes(8,"little"); b[54:56]=(56).to_bytes(2,"little"); b[56:58]=(1).to_bytes(2,"little")
                b[64:68]=(1).to_bytes(4,"little"); b[112:120]=a.to_bytes(8,"little")
                return bytes(b)
            
            def elf32(a):
                b=bytearray(84); b[0:4]=b"\x7fELF"; b[4]=1; b[5]=1
                b[28:32]=(52).to_bytes(4,"little"); b[42:44]=(32).to_bytes(2,"little"); b[44:46]=(1).to_bytes(2,"little")
                b[52:56]=(1).to_bytes(4,"little"); b[80:84]=a.to_bytes(4,"little")
                return bytes(b)
            
            def apk(name,libs):
                with ZipFile(base_apk,"r") as src, ZipFile(out/name,"w",ZIP_DEFLATED) as dst:
                    for i in src.infolist():
                        if not i.filename.startswith("lib/"):
                            dst.writestr(i,src.read(i.filename))
                    for p,d in libs.items():
                        dst.writestr(p,d)
            
            apk("abi-good64.apk",{"lib/arm64-v8a/libgood.so":elf64(16384),"lib/x86_64/libgood.so":elf64(16384)})
            apk("abi-bad64.apk",{"lib/arm64-v8a/libbad.so":elf64(4096)})
            apk("abi-mixed-32bad.apk",{"lib/arm64-v8a/libgood.so":elf64(16384),"lib/x86_64/libgood.so":elf64(16384),"lib/armeabi-v7a/liblegacy.so":elf32(4096)})
            with ZipFile(base_aab,"r") as src, ZipFile(out/"complex-native.aab","w",ZIP_DEFLATED) as dst:
                for i in src.infolist():
                    dst.writestr(i,src.read(i.filename))
                dst.writestr("feature/manifest/AndroidManifest.xml",b"feature-manifest-intentionally-not-base")
                dst.writestr("base/lib/arm64-v8a/libaab.so",elf64(16384),compress_type=ZIP_STORED)
                dst.writestr("base/assets/odd name/emoji-\U0001f680.txt",b"edge")
          PY
      - name: Validate controlled PLAY-005 semantics
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local id="$1" artifact="$2" expected="$3"
            local report="validation-output/$id.json"
            set +e
            ./target/debug/android-release-doctor --play --play-platform mobile --format json --output "$report" "$artifact"
            local code=$?
            set -e
            test "$code" = "0" || test "$code" = "1"
            python3 - "$report" "$id" "$expected" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          case,expected=sys.argv[2:4]
          f=next(x for x in r["findings"] if x["rule_id"]=="PLAY-005")
          print(case,f["severity"],sorted({x["abi"] for x in r["inventory"]["native_libraries"]}))
          assert f["severity"]==expected,f"{case}: expected {expected}, got {f['severity']}"
          PY
          }
          check good64 validation-output/abi-good64.apk PASS
          check bad64 validation-output/abi-bad64.apk BLOCKER
          check mixed32bad validation-output/abi-mixed-32bad.apk BLOCKER
      - name: Validate complex AAB boundary
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./target/debug/android-release-doctor --play --play-platform mobile --format json --output validation-output/complex-native.json validation-output/complex-native.aab
          code=$?
          set -e
          test "$code" = "0" || test "$code" = "1"
          python3 <<'PY'
            import json
            r=json.load(open("validation-output/complex-native.json",encoding="utf-8"))
            assert r["artifact"]["kind"]=="AAB"
            assert r["application"]["package_name"]=="com.example.protoaab"
            f=next(x for x in r["findings"] if x["rule_id"]=="PLAY-005")
            assert f["severity"]=="MANUAL-REVIEW",f["severity"]
            assert any(x["path"]=="feature/manifest/AndroidManifest.xml" for x in r["inventory"]["entries"])
            print("AAB boundary ok")
          PY

  project-mismatch:
    name: "Gradle cross-check semantic matrix"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build CLI
        run: cargo build --quiet -p doctor-cli
      - name: Generate mismatch projects and audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf validation-output/projects
          mkdir -p validation-output/projects
          cp -R tests/fixtures/project-release validation-output/projects/base
          make_case() {
            local id="$1" old="$2" new="$3" rule="$4" severity="$5"
            local dir="validation-output/projects/$id"
            cp -R validation-output/projects/base "$dir"
            python3 - "$dir/build.gradle" "$old" "$new" <<'PY'
          import sys
          p,old,new=sys.argv[1:4]
          s=open(p,encoding="utf-8").read()
          assert old in s,old
          open(p,"w",encoding="utf-8").write(s.replace(old,new,1))
          PY
            local report="validation-output/projects/$id.json"
            set +e
            ./target/debug/android-release-doctor --format json --output "$report" --project "$dir" tests/fixtures/minimal-release.apk
            local code=$?
            set -e
            test "$code" = "0" || test "$code" = "1" || test "$code" = "2"
            python3 - "$report" "$id" "$rule" "$severity" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          case,rule,expected=sys.argv[2:5]
          f=next(x for x in r["findings"] if x["rule_id"]==rule)
          assert f["severity"]==expected,f"{case}: {f['severity']} != {expected}"
          print(case,rule,f["severity"])
          PY
          }
          make_case appid "applicationId 'com.example.doctorfixture'" "applicationId 'com.example.otherapp'" CROSSCHECK-001 BLOCKER
          make_case target "targetSdk 35" "targetSdk 36" CROSSCHECK-002 BLOCKER
          make_case minsdk "minSdk 24" "minSdk 23" CROSSCHECK-003 WARNING
          make_case versioncode "versionCode 7" "versionCode 8" CROSSCHECK-004 WARNING
          make_case versionname "versionName '1.2.3'" "versionName '1.2.4'" CROSSCHECK-005 WARNING
          make_case debug "debuggable false" "debuggable true" CROSSCHECK-006 BLOCKER

  malformed-scale-public:
    name: "Malformed, scale and public corpus"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build CLI
        run: cargo build --quiet -p doctor-cli
      - name: Create malformed and large corpora
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
            from pathlib import Path
            from zipfile import ZipFile,ZIP_DEFLATED,ZIP_STORED
            base=Path("tests/fixtures/minimal-release.apk")
            out=Path("validation-output")
            out.mkdir(parents=True,exist_ok=True)
            with ZipFile(base,"r") as src:
                entries=[(i,src.read(i.filename)) for i in src.infolist()]
            with ZipFile(out/"missing-manifest.apk","w",ZIP_DEFLATED) as dst:
                for i,d in entries:
                    if i.filename!="AndroidManifest.xml": dst.writestr(i,d)
            with ZipFile(out/"bad-manifest.apk","w",ZIP_DEFLATED) as dst:
                for i,d in entries: dst.writestr(i,b"\x03\x00\x08" if i.filename=="AndroidManifest.xml" else d)
            with ZipFile(out/"large-central-directory.apk","w",ZIP_STORED) as dst:
                for i,d in entries: dst.writestr(i,d)
                for n in range(25000): dst.writestr(f"assets/stress/{n:05d}-"+("x"*80)+".bin",b"x")
            with ZipFile(out/"weird-paths.apk","w",ZIP_DEFLATED) as dst:
                for i,d in entries: dst.writestr(i,d)
                dst.writestr("../outside.txt",b"edge")
                dst.writestr("assets/../normalized.txt",b"edge")
                dst.writestr("assets/space name.txt",b"edge")
                dst.writestr("assets/emoji-\U0001f680.txt",b"edge")
                dst.writestr("assets/"+"y"*240+".txt",b"edge")
          PY
      - name: Validate malformed findings
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./target/debug/android-release-doctor --format json --output validation-output/missing.json validation-output/missing-manifest.apk
          missing=$?
          ./target/debug/android-release-doctor --format json --output validation-output/bad.json validation-output/bad-manifest.apk
          bad=$?
          set -e
          test "$missing" = "1"
          test "$bad" = "1"
          python3 <<'PY'
            import json
            for n in ("missing","bad"):
                r=json.load(open("validation-output/"+n+".json",encoding="utf-8"))
                f=next(x for x in r["findings"] if x["rule_id"]=="MANIFEST-002")
                assert f["severity"]=="BLOCKER"
                print(n,f["severity"])
          PY
      - name: Validate scale and weird-path corpora
        shell: bash
        run: |
          set -euo pipefail
          for n in large-central-directory weird-paths; do
            set +e
            ./target/debug/android-release-doctor --format json --output "validation-output/$n.json" "validation-output/$n.apk"
            code=$?
            set -e
            test "$code" = "0" || test "$code" = "1" || test "$code" = "2"
            python3 - "$n" <<'PY'
          import json,sys
          n=sys.argv[1]
          r=json.load(open("validation-output/"+n+".json",encoding="utf-8"))
          assert r["schema_version"]=="1.0"
          print(n,"entries=",len(r["inventory"]["entries"]))
          PY
          done
      - name: Validate CLI usage errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output/outdir
          set +e
          ./target/debug/android-release-doctor --format yaml >/dev/null 2>validation-output/bad-format.err
          a=$?
          ./target/debug/android-release-doctor --format json --output validation-output/outdir tests/fixtures/minimal-release.apk >/dev/null 2>validation-output/bad-output.err
          b=$?
          ./target/debug/android-release-doctor validation-output/no-such.apk >/dev/null 2>validation-output/missing.err
          c=$?
          set -e
          test "$a" = "2"; test "$b" = "2"; test "$c" = "2"
          grep -qi "unknown output format" validation-output/bad-format.err
      - name: Prepare spaced artifact
        run: cp tests/fixtures/minimal-release.apk "validation-output/artifact with spaces.apk"
      - name: Audit spaced artifact through Action
        continue-on-error: true
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: validation-output/artifact with spaces.apk
          format: json
          output: validation-output/action-spaces.json
      - name: Download public Session APK
        run: curl --fail --location --retry 4 --retry-all-errors --output validation-output/session.apk https://github.com/session-foundation/session-android/releases/download/1.33.5/session-1.33.5-universal-play-release.apk
      - name: Verify Session APK checksum
        run: echo "964f99d1121118849ea5bbc6ed9a46f543dfcd8eb9dc6d6e6074f68c9ab2d220  validation-output/session.apk" | sha256sum --check -
      - name: Audit Session APK through Action
        continue-on-error: true
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: validation-output/session.apk
          play: "true"
          play-platform: mobile
          format: json
          output: validation-output/session.json
      - name: Download public Session AAB
        run: curl --fail --location --retry 4 --retry-all-errors --output validation-output/session.aab https://github.com/session-foundation/session-android/releases/download/1.33.5/app-play-release.aab
      - name: Verify Session AAB checksum
        run: echo "e1460fce8b3329975e83e9340d156c596147875a2f4299a78a40c62d4f491ac9  validation-output/session.aab" | sha256sum --check -
      - name: Audit Session AAB through Action
        continue-on-error: true
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: validation-output/session.aab
          play: "true"
          play-platform: mobile
          format: json
          output: validation-output/session-aab.json
      - name: Download public Termux APK
        run: curl --fail --location --retry 4 --retry-all-errors --output validation-output/termux.apk https://github.com/termux/termux-app/releases/download/v0.119.0-beta.3/termux-app_v0.119.0-beta.3+apt-android-7-github-debug_universal.apk
      - name: Record Termux checksum
        run: sha256sum validation-output/termux.apk > validation-output/termux.sha256
      - name: Audit public Termux APK through Action
        continue-on-error: true
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: validation-output/termux.apk
          play: "true"
          play-platform: mobile
          format: json
          output: validation-output/termux.json
      - name: Validate public reports
        shell: bash
        run: |
          set -euo pipefail
          for f in validation-output/session.json validation-output/session-aab.json validation-output/termux.json; do
            test -s "$f"
            python3 - "$f" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["schema_version"]=="1.0"
          assert r["artifact"]["kind"] in ("APK","AAB")
          print(sys.argv[1],r["artifact"]["kind"],r["application"].get("target_sdk"),len(r["inventory"]["native_libraries"]))
          PY
          done
