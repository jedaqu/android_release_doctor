name: Rust CI

on:
  push:
    branches:
      - main
      - m0-foundation
      - m05-package-alignment
      - m05-crypto-signatures
      - m06-block1-state-hardening
      - m06-block2-signing-evidence
      - m06-block3-verification-hardening
      - m06-block4-signer-error-isolation
      - m06-block5-verification-completeness
      - m07-block1-crypto-coverage
      - m07-block2-rotation-semantics
      - m07-block3-v31-verification
      - m07-block4-integration-completeness
      - m08-block1-report-contract
      - m08-block2-cli-output-contract
      - m08-block3-github-action
      - m08-block4-distribution-release
      - m09-block1-public-release-onboarding
  pull_request:
    branches:
      - main
      - m04-elf-signing
      - m05-package-alignment
      - m05-crypto-signatures
      - m06-block1-state-hardening
      - m06-block2-signing-evidence
      - m06-block3-verification-hardening
      - m06-block4-signer-error-isolation
      - m07-block1-crypto-coverage
      - m07-block2-rotation-semantics
      - m07-block3-v31-verification
      - m07-block4-integration-completeness

      - m08-block1-report-contract
      - m08-block2-cli-output-contract
      - m08-block3-github-action

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
