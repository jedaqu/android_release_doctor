name: TEMP RSA-16384 Fixture Harvest

on:
  push:
    branches:
      - fix/err-038-b-rsa-1024-16384-2026-10-02

jobs:
  harvest:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch AOSP RSA-16384 test key
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://android.googlesource.com/platform/tools/apksig/+/refs/heads/main/src/test/resources/com/android/apksig/rsa-16384.pk8?format=TEXT"             | base64 --decode > rsa-16384.pk8
          curl -fsSL "https://android.googlesource.com/platform/tools/apksig/+/refs/heads/main/src/test/resources/com/android/apksig/rsa-16384.x509.pem?format=TEXT"             | sed '/^-----BEGIN CERTIFICATE-----$/d;/^-----END CERTIFICATE-----$/d'             | tr -d '\r\n'             | fold -w 64 > cert-body.txt
          {
            echo "-----BEGIN CERTIFICATE-----"
            cat cert-body.txt
            echo "-----END CERTIFICATE-----"
          } > rsa-16384.x509.pem
          openssl pkcs8 -inform DER -nocrypt -in rsa-16384.pk8 -out rsa-16384.key.pem
          printf '%s' "Android Release Doctor ERR-038-B RSA-16384 deterministic test message" > message.txt
          openssl dgst -sha256 -sign rsa-16384.key.pem -out sig-pkcs1-sha256.bin message.txt
          openssl dgst -sha512 -sign rsa-16384.key.pem -out sig-pkcs1-sha512.bin message.txt
          openssl dgst -sha256 -sign rsa-16384.key.pem             -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:32             -out sig-pss-sha256.bin message.txt
          openssl dgst -sha512 -sign rsa-16384.key.pem             -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:64             -out sig-pss-sha512.bin message.txt
          rm -f rsa-16384.pk8 rsa-16384.key.pem cert-body.txt
      - name: Upload generated public test vectors
        uses: actions/upload-artifact@v4
        with:
          name: err-038-b-rsa-16384-vectors
          path: |
            rsa-16384.x509.pem
            message.txt
            sig-pkcs1-sha256.bin
            sig-pkcs1-sha512.bin
            sig-pss-sha256.bin
            sig-pss-sha512.bin
          if-no-files-found: error
