name: M0.7 Lock Snapshot

on:
  push:
    branches:
      - m07-block1-crypto-coverage

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: m07-cargo-lock
          path: Cargo.lock
