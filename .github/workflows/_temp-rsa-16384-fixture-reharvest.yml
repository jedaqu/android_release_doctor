name: TEMP RSA-16384 Fixture Reharvest

on:
  push:
    branches:
      - fix/err-038-b-rsa-1024-16384-2026-10-02

jobs:
  harvest:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch matching AOSP key pair and generate vectors
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://android.googlesource.com/platform/tools/apksig/+/refs/heads/main/src/test/resources/com/android/apksig/rsa-16384.pk8?format=TEXT"             | base64 --decode > rsa-16384.pk8
          curl -fsSL "https://android.googlesource.com/platform/tools/apksig/+/refs/heads/main/src/test/resources/com/android/apksig/rsa-16384.x509.pem?format=TEXT"             | base64 --decode > rsa-16384.x509.pem

          openssl pkcs8 -inform DER -nocrypt -in rsa-16384.pk8 -out rsa-16384.key.pem

          cert_pub_hash="$(
            openssl x509 -in rsa-16384.x509.pem -pubkey -noout               | openssl pkey -pubin -outform DER               | sha256sum | cut -d' ' -f1
          )"
          key_pub_hash="$(
            openssl pkey -in rsa-16384.key.pem -pubout               | openssl pkey -pubin -outform DER               | sha256sum | cut -d' ' -f1
          )"

          test "$cert_pub_hash" = "$key_pub_hash"
          echo "Matching RSA-16384 certificate/private-key public component: $cert_pub_hash"

          printf '%s' "Android Release Doctor ERR-038-B RSA-16384 deterministic test message" > message.txt

          openssl dgst -sha256 -sign rsa-16384.key.pem -out sig-pkcs1-sha256.bin message.txt
          openssl dgst -sha512 -sign rsa-16384.key.pem -out sig-pkcs1-sha512.bin message.txt
          openssl dgst -sha256 -sign rsa-16384.key.pem             -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:32             -out sig-pss-sha256.bin message.txt
          openssl dgst -sha512 -sign rsa-16384.key.pem             -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:64             -out sig-pss-sha512.bin message.txt

          pubkey="$(mktemp)"
          openssl x509 -in rsa-16384.x509.pem -pubkey -noout > "$pubkey"

          openssl dgst -sha256 -verify "$pubkey" -signature sig-pkcs1-sha256.bin message.txt
          openssl dgst -sha512 -verify "$pubkey" -signature sig-pkcs1-sha512.bin message.txt
          openssl dgst -sha256 -verify "$pubkey" -signature sig-pss-sha256.bin             -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:32 message.txt
          openssl dgst -sha512 -verify "$pubkey" -signature sig-pss-sha512.bin             -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:64 message.txt

          rm -f rsa-16384.pk8 rsa-16384.key.pem "$pubkey"

      - name: Upload matching public certificate and signature vectors
        uses: actions/upload-artifact@v4
        with:
          name: err-038-b-rsa-16384-vectors-v2
          path: |
            rsa-16384.x509.pem
            message.txt
            sig-pkcs1-sha256.bin
            sig-pkcs1-sha512.bin
            sig-pss-sha256.bin
            sig-pss-sha512.bin
          if-no-files-found: error
