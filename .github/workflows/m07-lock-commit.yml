name: M0.7 Lock Commit

on:
  push:
    branches:
      - m07-block1-crypto-coverage

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "M0.7 Block 1: update Cargo.lock for crypto backend"
          git push origin HEAD:m07-block1-crypto-coverage
