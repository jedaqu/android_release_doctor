name: Product Repeatability Stress Test

on:
  push:
    branches:
      - test/stress-repeatability-2026-10-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeatability:
    name: "Repeatability • ${{ matrix.id }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: fixture-v2
            artifact: tests/fixtures/crypto-v2-release.apk
          - id: fixture-v31
            artifact: tests/fixtures/crypto-v31-release.apk
          - id: fixture-minimal-aab
            artifact: tests/fixtures/minimal-release.aab
          - id: external-session-apk
            artifact: external/session-1.33.5-universal-play-release.apk
            url: https://github.com/session-foundation/session-android/releases/download/1.33.5/session-1.33.5-universal-play-release.apk
            sha256: 964f99d1121118849ea5bbc6ed9a46f543dfcd8eb9dc6d6e6074f68c9ab2d220
          - id: external-session-aab
            artifact: external/session-1.33.5.aab
            url: https://github.com/session-foundation/session-android/releases/download/1.33.5/app-play-release.aab
            sha256: e1460fce8b3329975e83e9340d156c596147875a2f4299a78a40c62d4f491ac9

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare external artifact
        if: matrix.url != ''
        shell: bash
        env:
          URL: ${{ matrix.url }}
          SHA256: ${{ matrix.sha256 }}
          DEST: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DEST")"
          curl --fail --location --retry 4 --retry-all-errors --output "$DEST" "$URL"
          printf '%s  %s\n' "$SHA256" "$DEST" | sha256sum --check -
          test -s "$DEST"

      - name: Build doctor once
        run: cargo build --quiet -p doctor-cli

      - name: Repeated audits
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          CASE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repeatability"
          hashes=()
          exits=()
          for i in 1 2 3 4 5; do
            report="$RUNNER_TEMP/repeatability/$CASE_ID-$i.json"
            start=$(date +%s%N)
            set +e
            ./target/debug/android-release-doctor --play --play-platform mobile --format json --output "$report" "$ARTIFACT"
            code=$?
            set -e
            test "$code" = "0" || test "$code" = "1" || test "$code" = "2"
            test -s "$report"
            digest=$(python3 - "$report" <<'PY'
          import json, hashlib, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              obj=json.load(f)
          canonical=json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          print(hashlib.sha256(canonical).hexdigest())
          PY
            )
            end=$(date +%s%N)
            elapsed_ms=$(( (end-start)/1000000 ))
            printf '%s\t%d\t%s\t%dms\n' "$i" "$code" "$digest" "$elapsed_ms"
            hashes+=("$digest")
            exits+=("$code")
          done

          python3 - "$CASE_ID" "${hashes[@]}" "${exits[@]}" <<'PY'
          import sys
          case_id=sys.argv[1]
          digests=sys.argv[2:7]
          exits=sys.argv[7:12]
          assert len(set(digests)) == 1, f"{case_id}: non-deterministic canonical report hashes: {digests}"
          assert len(set(exits)) == 1, f"{case_id}: non-deterministic exit codes: {exits}"
          print(f"{case_id}: deterministic across 5 repetitions; exit={exits[0]}; report_sha256={digests[0]}")
          PY

      - name: Upload repeated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repeatability-${{ matrix.id }}
          path: ${{ runner.temp }}/repeatability/*.json
          if-no-files-found: ignore
          retention-days: 7
