name: Android Release Doctor — Action Validation

on:
  workflow_dispatch:

  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  action:
    runs-on: ubuntu-latest
    env:
      ANDROID_RELEASE_DOCTOR_TEST_RUNTIME_PATH: ${{ github.workspace }}/target/release/android-release-doctor

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify repository-root Action metadata
        run: test -f action.yml

      - name: Verify Node.js Action runtime
        run: |
          node --version
          node --check src/action.js

      - name: Verify runtime manifest
        run: node scripts/verify-runtime-manifest.mjs

      - name: Build prebuilt CLI for Action validation
        run: |
          cargo --version
          rustc --version
          cargo build --release --locked -p doctor-cli

      - name: Install Report v1 JSON Schema validator
        run: |
          python3 -m pip install --disable-pip-version-check --quiet "jsonschema==4.25.1"

      - name: Success path
        id: success
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          format: json
          output: ${{ runner.temp }}/android-release-doctor-success.json

      - name: Validate success report
        env:
          REPORT_PATH: ${{ steps.success.outputs.report-path }}
        run: |
          test -n "$REPORT_PATH"
          test -s "$REPORT_PATH"
          python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema_version"] == "1.0"
          assert "findings" in report
          assert "summary" in report
          PY

      - name: Blocker path
        id: blocker
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          play: "true"
          play-platform: mobile
          format: json
          output: ${{ runner.temp }}/android-release-doctor-blocker.json

      - name: Validate blocker result
        env:
          EXIT_CODE: ${{ steps.blocker.outputs.exit-code }}
          REPORT_PATH: ${{ steps.blocker.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "1"
          test -s "$REPORT_PATH"

          python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema_version"] == "1.0"
          assert report["summary"]["blockers"] > 0
          PY


      - name: AAB path
        id: aab
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.aab
          format: json
          output: ${{ runner.temp }}/android-release-doctor-aab.json

      - name: Validate AAB report
        env:
          EXIT_CODE: ${{ steps.aab.outputs.exit-code }}
          REPORT_PATH: ${{ steps.aab.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "1"
          test -s "$REPORT_PATH"
          python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["artifact"]["kind"] == "AAB"
          assert report["schema_version"] == "1.0"
          PY

      - name: Project path
        id: project
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          project: tests/fixtures/project-release
          format: json
          output: ${{ runner.temp }}/android-release-doctor-project.json

      - name: Validate project report
        env:
          EXIT_CODE: ${{ steps.project.outputs.exit-code }}
          REPORT_PATH: ${{ steps.project.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "0"
          test -s "$REPORT_PATH"
          python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["project"]["application_id"] == "com.example.doctorfixture"
          assert report["project"]["target_sdk"] == 35
          PY

      - name: Project and Play path
        id: project_play
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          project: tests/fixtures/project-release
          play: "true"
          play-platform: mobile
          format: json
          output: ${{ runner.temp }}/android-release-doctor-project-play.json

      - name: Validate project and Play result
        env:
          EXIT_CODE: ${{ steps.project_play.outputs.exit-code }}
          REPORT_PATH: ${{ steps.project_play.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "1"
          test -s "$REPORT_PATH"
          python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["project"]["application_id"] == "com.example.doctorfixture"
          assert report["play"]["platform"] == "mobile"
          assert report["summary"]["blockers"] > 0
          PY

      - name: Non-default Play platform
        id: automotive
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          play: "true"
          play-platform: automotive
          format: json
          output: ${{ runner.temp }}/android-release-doctor-automotive.json

      - name: Validate non-default Play platform
        env:
          EXIT_CODE: ${{ steps.automotive.outputs.exit-code }}
          REPORT_PATH: ${{ steps.automotive.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "0"
          test -s "$REPORT_PATH"
          python3 - "$REPORT_PATH" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["play"]["platform"] == "automotive"
          PY

      - name: Invalid play input
        id: invalid_play
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          play: "maybe"
          format: json
          output: ${{ runner.temp }}/android-release-doctor-invalid-play.json

      - name: Validate invalid play input
        env:
          EXIT_CODE: ${{ steps.invalid_play.outputs.exit-code }}
          REPORT_PATH: ${{ steps.invalid_play.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "2"
          test -z "$REPORT_PATH"
          test ! -e "${{ runner.temp }}/android-release-doctor-invalid-play.json"

      - name: Invalid output format
        id: invalid_format
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          format: yaml
          output: ${{ runner.temp }}/android-release-doctor-invalid-format.json

      - name: Validate invalid output format
        env:
          EXIT_CODE: ${{ steps.invalid_format.outputs.exit-code }}
          REPORT_PATH: ${{ steps.invalid_format.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "2"
          test "$REPORT_PATH" = "${{ runner.temp }}/android-release-doctor-invalid-format.json"
          test ! -e "${{ runner.temp }}/android-release-doctor-invalid-format.json"

      - name: Invalid Play platform
        id: invalid_platform
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          play: "true"
          play-platform: invalid-platform
          format: json
          output: ${{ runner.temp }}/android-release-doctor-invalid-platform.json

      - name: Validate invalid Play platform
        env:
          EXIT_CODE: ${{ steps.invalid_platform.outputs.exit-code }}
          REPORT_PATH: ${{ steps.invalid_platform.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "2"
          test "$REPORT_PATH" = "${{ runner.temp }}/android-release-doctor-invalid-platform.json"
          test ! -e "${{ runner.temp }}/android-release-doctor-invalid-platform.json"

      - name: Invalid output path
        id: invalid_output
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/minimal-release.apk
          format: json
          output: |
            ${{ runner.temp }}/android-release-doctor-invalid
            path.json

      - name: Validate invalid output path
        env:
          EXIT_CODE: ${{ steps.invalid_output.outputs.exit-code }}
          REPORT_PATH: ${{ steps.invalid_output.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "2"
          test -z "$REPORT_PATH"


      - name: Validate generated reports against the published schema
        env:
          SCHEMA: ${{ github.workspace }}/docs/report-schema-v1.0.json
          SUCCESS_REPORT: ${{ steps.success.outputs.report-path }}
          AAB_REPORT: ${{ steps.aab.outputs.report-path }}
          PROJECT_REPORT: ${{ steps.project.outputs.report-path }}
          PROJECT_PLAY_REPORT: ${{ steps.project_play.outputs.report-path }}
          AUTOMOTIVE_REPORT: ${{ steps.automotive.outputs.report-path }}
        run: |
          python3 - "$SCHEMA" "$SUCCESS_REPORT" "$AAB_REPORT" "$PROJECT_REPORT" "$PROJECT_PLAY_REPORT" "$AUTOMOTIVE_REPORT" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path(sys.argv[1])
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)

          for raw_path in sys.argv[2:]:
              path = Path(raw_path)
              if not path.is_file():
                  raise SystemExit(f"missing report: {path}")
              report = json.loads(path.read_text(encoding="utf-8"))
              errors = sorted(validator.iter_errors(report), key=lambda error: list(error.path))
              if errors:
                  for error in errors:
                      print(f"{path}: {error.message}", file=sys.stderr)
                  raise SystemExit(f"schema validation failed: {path}")
              print(f"schema PASS: {path}")
          PY

      - name: Consumer-style branch Action invocation during architecture migration
        id: consumer
        uses: jedaqu/android_release_doctor@service/prebuilt-cli-runtime-2026-10-03
        with:
          artifact: tests/fixtures/minimal-release.apk
          format: json
          output: ${{ runner.temp }}/android-release-doctor-consumer.json

      - name: Validate consumer-style Action result
        env:
          EXIT_CODE: ${{ steps.consumer.outputs.exit-code }}
          REPORT_PATH: ${{ steps.consumer.outputs.report-path }}
        run: |
          test "$EXIT_CODE" = "0"
          test -s "$REPORT_PATH"
          python3 - "$REPORT_PATH" "$GITHUB_WORKSPACE/docs/report-schema-v1.0.json" <<'PY'
          import json
          import sys
          from jsonschema import Draft202012Validator

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          schema = json.load(open(sys.argv[2], encoding="utf-8"))
          errors = list(Draft202012Validator(schema).iter_errors(report))
          if errors:
              for error in errors:
                  print(error.message, file=sys.stderr)
              raise SystemExit(1)
          assert report["schema_version"] == "1.0"
          print("consumer-style Action + schema PASS")
          PY

      - name: Deterministic APK and AAB corpus
        env:
          SCHEMA: ${{ github.workspace }}/docs/report-schema-v1.0.json
        run: |
          python3 - "$SCHEMA" <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("tests/fixtures")
          schema = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)

          corpus = [
              "minimal-release.apk",
              "minimal-release.aab",
              "crypto-v2-release.apk",
              "crypto-v2-empty-element-release.apk.b64",
              "crypto-v3-release.apk",
              "crypto-v31-release.apk",
              "crypto-v31-lineage-mismatch.apk",
              "crypto-v31-no-v3-attr.apk",
              "crypto-v31-no-v3.apk",
              "crypto-v31-wrong-rotation-min-sdk.apk",
              "m07-crypto-v2-ecdsa-sha512-p384.apk",
              "m07-crypto-v3-ecdsa-sha512-p384.apk",
          ]

          with tempfile.TemporaryDirectory() as tmp:
              for name in corpus:
                  source = root / name
                  artifact = source
                  if source.suffix == ".b64":
                      import base64
                      artifact = Path(tmp) / source.stem
                      artifact.write_bytes(base64.b64decode(source.read_bytes()))
                  report_path = Path(tmp) / f"{artifact.stem}.json"
                  result = subprocess.run(
                      [
                          "cargo", "run", "--locked", "--quiet",
                          "--manifest-path", "Cargo.toml",
                          "-p", "doctor-cli", "--",
                          "--format", "json",
                          "--output", str(report_path),
                          str(artifact),
                      ],
                      text=True,
                      capture_output=True,
                  )
                  if result.returncode not in (0, 1):
                      print(result.stdout, file=sys.stdout)
                      print(result.stderr, file=sys.stderr)
                      raise SystemExit(f"unexpected CLI exit {result.returncode}: {name}")
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  errors = list(validator.iter_errors(report))
                  if errors:
                      for error in errors:
                          print(f"{name}: {error.message}", file=sys.stderr)
                      raise SystemExit(f"schema validation failed for corpus item: {name}")
                  print(f"corpus PASS exit={result.returncode}: {name}")
          PY

      - name: Operational error path
        id: error
        continue-on-error: true
        uses: ./
        with:
          artifact: tests/fixtures/does-not-exist.apk
          format: json
          output: ${{ runner.temp }}/android-release-doctor-error.json

      - name: Validate operational error
        env:
          EXIT_CODE: ${{ steps.error.outputs.exit-code }}
        run: test "$EXIT_CODE" = "2"
