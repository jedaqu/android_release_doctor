name: Product Surface Cleanup Validation

on:
  push:
    branches:
      - cleanup/remove-v01-release-machinery-2026-10-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate expected product tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/m08-block4-distribution.yml
          test ! -e CHANGELOG.md
          test ! -e docs/M0.8-BLOCK4-DISTRIBUTION-CONTRACT.md
          test ! -e docs/M0.8-MANUAL-WORKFLOW-EXECUTION.md
          test ! -e docs/CHECKPOINT-V0.1.3-DISTRIBUTION-LIMITATION-CLOSED-2026-10-02.md
          test -e .github/actions/android-release-doctor/action.yml
          test -e .github/workflows/m08-block3-action.yml
          test -e .github/workflows/rust.yml

      - name: Validate active README boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'v0\.1\.3' README.md; then exit 1; fi
          if grep -qi 'tag-driven' README.md; then exit 1; fi
          if grep -qi 'distribution workflow' README.md; then exit 1; fi
          grep -q 'primary product surface is the reusable GitHub Action' README.md
          grep -q 'GitHub Action.*CLI.*audit engine\|GitHub Action interface' README.md

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build CLI
        run: cargo build --quiet -p doctor-cli

      - name: Local CLI success
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/android-release-doctor --format json --output cleanup-success.json tests/fixtures/minimal-release.apk
          test -s cleanup-success.json

      - name: Action success path
        id: success
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: tests/fixtures/minimal-release.apk
          format: json
          output: ${{ runner.temp }}/cleanup-success-action.json

      - name: Validate Action success
        env:
          EXIT_CODE: ${{ steps.success.outputs.exit-code }}
          REPORT_PATH: ${{ steps.success.outputs.report-path }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = "0"
          test -s "$REPORT_PATH"

      - name: Action blocker path
        id: blocker
        continue-on-error: true
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: tests/fixtures/minimal-release.apk
          play: "true"
          play-platform: mobile
          format: json
          output: ${{ runner.temp }}/cleanup-blocker-action.json

      - name: Validate Action blocker
        env:
          EXIT_CODE: ${{ steps.blocker.outputs.exit-code }}
          REPORT_PATH: ${{ steps.blocker.outputs.report-path }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = "1"
          test -s "$REPORT_PATH"

      - name: Action operational error path
        id: operational
        continue-on-error: true
        uses: ./.github/actions/android-release-doctor
        with:
          artifact: tests/fixtures/does-not-exist.apk
          format: json
          output: ${{ runner.temp }}/cleanup-operational-action.json

      - name: Validate Action operational error
        env:
          EXIT_CODE: ${{ steps.operational.outputs.exit-code }}
        run: test "$EXIT_CODE" = "2"

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors -o actionlint-install.sh https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash actionlint-install.sh
          test -x actionlint

      - name: Lint active workflows
        run: ./actionlint .github/workflows/*.yml
