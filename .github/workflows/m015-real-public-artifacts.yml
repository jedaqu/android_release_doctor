name: Android Release Doctor — Real Public Artifact Test (temporary)

on:
  push:
    branches:
      - test/m015-real-public-artifacts-2026-10-03
  workflow_dispatch:

jobs:
  real-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download and verify Ventoid 0.3.1 release artifacts
        run: |
          set -euo pipefail
          mkdir -p ${{ runner.temp }}/ventoid
          curl -fL --retry 3 -o ${{ runner.temp }}/ventoid/Ventoid_0.3.1.apk             "https://github.com/GPLaider/Ventoid/releases/download/v0.3.1/Ventoid_0.3.1.apk"
          curl -fL --retry 3 -o ${{ runner.temp }}/ventoid/Ventoid_0.3.1.aab             "https://github.com/GPLaider/Ventoid/releases/download/v0.3.1/Ventoid_0.3.1.aab"
          test "$(sha256sum ${{ runner.temp }}/ventoid/Ventoid_0.3.1.apk | cut -d' ' -f1)" = "50bd5979ff7bfa5560ce6a52386a43bd3e3b738b40218a897debd9573926d2ca"
          test "$(sha256sum ${{ runner.temp }}/ventoid/Ventoid_0.3.1.aab | cut -d' ' -f1)" = "c27c7c1dd2a2b3445373dde0f9260af604af3ce087aa8e4e21cd9ddd5a0a10f3"

      - name: Install Report v1 JSON Schema validator
        run: |
          python3 -m pip install --disable-pip-version-check --quiet "jsonschema==4.25.1"

      - name: Test Ventoid APK and AAB with Android Release Doctor
        env:
          SCHEMA: ${{ github.workspace }}/docs/report-schema-v1.0.json
          ROOT: ${{ runner.temp }}/ventoid
        run: |
          set -euo pipefail
          python3 - "$SCHEMA" "$ROOT" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          root = Path(sys.argv[2])

          for name, expected_kind in [
              ("Ventoid_0.3.1.apk", "APK"),
              ("Ventoid_0.3.1.aab", "AAB"),
          ]:
              artifact = root / name
              report = root / f"{artifact.stem}.report.json"
              result = subprocess.run(
                  [
                      "cargo", "run", "--locked", "--quiet",
                      "--manifest-path", "Cargo.toml",
                      "-p", "doctor-cli", "--",
                      "--format", "json",
                      "--output", str(report),
                      str(artifact),
                  ],
                  text=True,
                  capture_output=True,
              )

              print(f"=== Ventoid 0.3.1 :: {name} ===")
              print(f"exit={result.returncode}")
              if result.stderr:
                  print(result.stderr, file=sys.stderr)

              if result.returncode not in (0, 1):
                  raise SystemExit(f"unexpected ADR exit code: {result.returncode}")

              data = json.loads(report.read_text(encoding="utf-8"))
              errors = sorted(validator.iter_errors(data), key=lambda e: list(e.path))
              if errors:
                  for error in errors:
                      print(f"schema error: {error.message}", file=sys.stderr)
                  raise SystemExit("Report v1 schema validation failed")

              assert data["schema_version"] == "1.0"
              assert data["artifact"]["kind"] == expected_kind

              print(
                  "RESULT",
                  json.dumps(
                      {
                          "artifact": name,
                          "kind": data["artifact"]["kind"],
                          "exit_code": result.returncode,
                          "summary": data["summary"],
                          "application": data["application"],
                          "non_pass_findings": [
                              f for f in data["findings"] if f["severity"] != "PASS"
                          ],
                      },
                      sort_keys=True,
                  ),
              )
              print("REPORT V1 SCHEMA: PASS")
          PY
